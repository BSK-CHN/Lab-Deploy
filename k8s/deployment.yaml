apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      containers:
        - name: lab-app
          image: docker.io/thecloudschool/lab-app:7f71a9c3015f2c84cd1e2402a4a7f9753412a0a9
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-app
spec:
  selector:
    app: lab-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
